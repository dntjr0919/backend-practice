<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>한 줄 방명록</title>
  <style>
    body { font-family: sans-serif; max-width: 600px; margin: 40px auto; padding: 0 20px; }
    form { display: flex; flex-direction: column; gap: 10px; margin-bottom: 24px; }
    input, textarea, button { padding: 8px; font-size: 14px; }
    .card { border: 1px solid #ddd; border-radius: 6px; padding: 12px; margin-bottom: 10px; }
    .meta { font-size: 12px; color: #666; margin-bottom: 6px; }
  </style>
</head>
<body>
  <h2>한 줄 방명록</h2>
  <form id="msgForm">
    <input type="text" id="name" placeholder="작성자 이름" required />
    <textarea id="message" rows="3" placeholder="남길 메시지를 입력하세요" required></textarea>
    <button type="submit">등록하기</button>
  </form>

  <div id="entries"></div>

  <script>
    // 2단계에서 발급받은 백엔드 주소로 교체
    const BACKEND_URL = "https://my-backend.onrender.com";

    async function loadEntries() {
      const res = await fetch(`${BACKEND_URL}/api/guestbook`);
      const data = await res.json();
      const container = document.getElementById("entries");
      container.innerHTML = data.map(item => `
        <div class="card">
          <div class="meta"><strong>${item.name}</strong> · ${new Date(item.created_at).toLocaleString()}</div>
          <div>${item.message}</div>
        </div>
      `).join("");
    }

    document.getElementById("msgForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const name = document.getElementById("name").value;
      const message = document.getElementById("message").value;

      await fetch(`${BACKEND_URL}/api/guestbook`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ name, message })
      });

      document.getElementById("name").value = "";
      document.getElementById("message").value = "";
      loadEntries();
    });

    loadEntries();
  </script>
</body>
</html>
